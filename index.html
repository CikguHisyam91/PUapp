<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>SilatApp Pusat</title>
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-title" content="SilatApp">
<meta name="theme-color" content="#0F1115">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>
:root{--bg:#0F1115;--kad:#181B22;--kad2:#20242D;--garis:#2C313C;--teks:#E8E9EC;--pudar:#9097A3;--emas:#E2B55A;--hijau:#3FB97B;--merah:#E0605A;--kuning:#E2B55A;--biru:#5A9BE2}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--teks);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
a{color:var(--emas)}
.wrap{max-width:760px;margin:0 auto;padding:14px 14px 110px}
header{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--garis);background:#0B0D10;position:sticky;top:0;z-index:10}
header img{width:38px;height:38px;border-radius:50%;background:#fff;flex:none}
header .t{flex:1;min-width:0}
header .t b{display:block;font-size:17px}
header .t small{color:var(--pudar);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:12px}
.ikon{width:44px;height:44px;flex:none;display:inline-flex;align-items:center;justify-content:center;border-radius:12px;background:var(--kad);border:1px solid var(--garis);color:var(--teks);font-size:20px;padding:0;cursor:pointer;min-height:0}
.tajuk{display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:1px solid var(--garis);position:sticky;top:59px;background:var(--bg);z-index:9}
.tajuk h2{flex:1;margin:0;font-size:19px}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:10px 14px;border-bottom:1px solid var(--garis);scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:none}
button,.btn{background:var(--kad2);color:var(--teks);border:1px solid var(--garis);border-radius:12px;padding:11px 16px;font:inherit;font-size:15px;cursor:pointer;min-height:44px}
button.utama{background:var(--emas);color:#1a1405;border-color:var(--emas);font-weight:700}
button.aktif{border-color:var(--emas);color:var(--emas)}
button.kecil{padding:6px 12px;font-size:14px;min-height:36px}
button.bahaya{border-color:var(--merah);color:var(--merah);background:transparent}
button.penuh{width:100%}
button:disabled{opacity:.5}
input,select,textarea{width:100%;background:var(--kad2);color:var(--teks);border:1px solid var(--garis);border-radius:12px;padding:12px 14px;font:inherit;font-size:16px;min-height:48px}
select{appearance:none;-webkit-appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--teks) 50%),linear-gradient(135deg,var(--teks) 50%,transparent 50%);background-position:calc(100% - 20px) 21px,calc(100% - 15px) 21px;background-size:5px 5px;background-repeat:no-repeat;padding-right:36px}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--emas)}
label{display:block;margin:12px 0 6px;color:var(--pudar);font-size:14px}
.kad{background:var(--kad);border:1px solid var(--garis);border-radius:16px;padding:16px;margin-bottom:12px}
.kad h3{margin:0 0 10px;color:var(--emas);font-size:16px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media(min-width:600px){.grid{grid-template-columns:repeat(3,1fr)}}
.stat{background:var(--kad2);border-radius:12px;padding:12px}
.stat b{display:block;font-size:22px;color:var(--emas)}
.stat small{color:var(--pudar);font-size:13px}
.jad{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:9px 8px;border-bottom:1px solid var(--garis);text-align:left;vertical-align:top}
th{color:var(--pudar);font-weight:500;white-space:nowrap}
.baris{display:flex;gap:10px;align-items:center}
.baris>*{flex:1;min-width:0}
.baris.balut{flex-wrap:wrap}.baris.balut>*{min-width:140px}
.pudar{color:var(--pudar)}
.tag{display:inline-block;padding:3px 10px;border-radius:8px;font-size:13px;font-weight:700;white-space:nowrap}
.t-AKTIF,.t-HIJAU{background:#1f3a2c;color:var(--hijau)}
.t-MENUNGGU,.t-KUNING{background:#3a321f;color:var(--kuning)}
.t-TIDAK{background:#2a2d33;color:var(--pudar)}
.t-DIGANTUNG,.t-DISEKAT,.t-DITOLAK,.t-DIBATALKAN,.t-MERAH{background:#3a2020;color:var(--merah)}
.t-BERPINDAH,.t-BERSAMA,.t-BIRU,.t-KETUA{background:#1f2c3a;color:var(--biru)}
.ring{background:var(--kad);border:1px solid var(--garis);border-radius:16px;padding:18px;margin-bottom:12px}
.ring .besar{font-size:30px;font-weight:800}
.ring .sub{display:flex;justify-content:space-between;align-items:center;color:var(--pudar);font-size:14px;margin:4px 0 12px;gap:8px}
.bar{height:8px;background:var(--kad2);border-radius:8px;overflow:hidden}.bar i{display:block;height:100%;background:var(--hijau);border-radius:8px}
.cip{display:flex;gap:8px;overflow-x:auto;margin:6px 0 12px;scrollbar-width:none}
.cip::-webkit-scrollbar{display:none}
.cip button{flex:none;border-radius:20px;padding:8px 16px;min-height:40px;background:var(--kad);color:var(--pudar);font-weight:600}
.cip button.on{background:#EDEEF0;color:#111;border-color:#EDEEF0}
.item{display:flex;align-items:center;gap:12px;background:var(--kad);border:1px solid var(--garis);border-radius:14px;padding:14px 16px;margin-bottom:8px;cursor:pointer}
.item .k{flex:1;min-width:0}
.item .k b{display:block;font-size:15px;line-height:1.3;text-transform:uppercase}
.item .k small{color:var(--pudar);font-size:13px}
.item .r{flex:none;display:flex;align-items:center;gap:8px}
.semak{width:46px;height:46px;border-radius:12px;border:2px solid var(--garis);display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:800;color:transparent;flex:none}
.item.on .semak{background:var(--hijau);border-color:var(--hijau);color:#0b1a12}
.item.on{border-color:#2d5a43}
.menu{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media(min-width:600px){.menu{grid-template-columns:repeat(3,1fr)}}
.menu button{display:flex;flex-direction:column;align-items:flex-start;gap:8px;padding:18px 16px;border-radius:16px;background:var(--kad);text-align:left;min-height:110px}
.menu button .i{font-size:28px}
.menu button b{font-size:16px}
.menu button small{color:var(--pudar);font-size:12px}
.terapung{position:fixed;left:0;right:0;bottom:0;padding:12px 14px calc(12px + env(safe-area-inset-bottom));background:linear-gradient(transparent,var(--bg) 30%);z-index:8}
.terapung>div{max-width:760px;margin:0 auto}
.login{max-width:420px;margin:24px auto}
.login .logo{text-align:center}
.login .logo img{width:140px;height:140px;border-radius:50%;background:#fff;box-shadow:0 0 0 3px var(--emas)}
.login h1{color:var(--emas);text-align:center;margin:12px 0 2px;font-size:22px}
#toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--kad2);border:1px solid var(--emas);padding:12px 16px;border-radius:12px;width:max-content;max-width:92%;display:none;z-index:60}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.65);display:none;align-items:flex-end;justify-content:center;z-index:50}
#modal .isi{background:var(--kad);border:1px solid var(--garis);border-radius:20px 20px 0 0;padding:8px 16px calc(18px + env(safe-area-inset-bottom));width:100%;max-width:560px;max-height:92vh;overflow:auto}
#modal .isi:before{content:"";display:block;width:44px;height:5px;border-radius:5px;background:var(--garis);margin:4px auto 12px}
@media(min-width:700px){#modal{align-items:center}#modal .isi{border-radius:20px}}
.ahlikad{background:linear-gradient(135deg,#1c1f27,#0B0D10);border:2px solid var(--emas);border-radius:16px;padding:16px;display:flex;gap:14px;align-items:center}
.ahlikad img{width:68px;height:68px;border-radius:50%;background:#fff;flex:none}
.ahlikad .n{font-size:16px;font-weight:700}
.ahlikad .no{color:var(--emas);font-size:19px;font-weight:800;letter-spacing:1px}
.pdpa{font-size:13px;color:var(--pudar);background:var(--kad2);border:1px solid var(--garis);border-radius:12px;padding:12px;margin-top:12px}
.cek{display:flex;gap:10px;align-items:flex-start;margin-top:10px;color:var(--teks)}.cek input{width:22px;height:22px;min-height:0;margin-top:1px;flex:none}
.muat{opacity:.6;pointer-events:none}
.besarInput{font-size:26px;font-weight:800;text-align:center}
.fizgrid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:10px;padding-top:10px;border-top:1px solid var(--garis)}.fizgrid .tag{white-space:normal;margin:0 2px 3px 0;line-height:1.3}
.kotakHasil{background:var(--kad2);border-radius:14px;padding:6px 14px;margin-top:12px}
.kotakHasil .bar2{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--garis)}
.kotakHasil .bar2:last-child{border:0}
.kotakHasil .bar2 b{text-align:right}
/* ===== Paparan cetak (hitam putih) ===== */
#cetak{display:none;position:fixed;inset:0;z-index:100;background:#fff;color:#000;overflow:auto}
#cetak .alat{position:sticky;top:0;display:flex;gap:8px;padding:10px 14px;background:#111;z-index:2}
#cetak .alat button{flex:1}
#cetak .kertas{max-width:800px;margin:0 auto;padding:18px 16px 40px;font:13px/1.4 Arial,Helvetica,sans-serif;color:#000}
.kp-head{display:flex;align-items:center;gap:14px;border-bottom:3px double #000;padding-bottom:10px}
.kp-head img{width:70px;height:70px;filter:grayscale(1)}
.kp-head h1{font-size:17px;margin:0;letter-spacing:.5px}
.kp-head .g{font-size:15px;font-weight:700;margin-top:2px}
.kp-head .m{font-size:11px;margin-top:2px}
.kp-tajuk{text-align:center;font-size:15px;font-weight:700;margin:14px 0 4px;text-decoration:underline}
.kp-ring{width:100%;border-collapse:collapse;margin:8px 0 14px;font-size:11px}
.kp-ring td,.kp-ring th{border:1px solid #000;padding:3px 6px;text-align:center}
.kp-usia{background:#000;color:#fff;padding:7px 10px;font-weight:700;font-size:14px;margin-top:18px;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.kp-jan{border:2px solid #000;border-top:0;padding:5px 10px;font-weight:700;font-size:13px;letter-spacing:1px}
.kp-kelas{font-weight:700;margin:10px 0 4px;font-size:13px;border-bottom:1px solid #000;padding-bottom:2px}
table.kp{width:100%;border-collapse:collapse;font-size:12px;margin-bottom:6px;page-break-inside:avoid}
table.kp th,table.kp td{border:1px solid #000;padding:4px 6px;text-align:left;color:#000}
table.kp th{background:#e6e6e6;font-weight:700;-webkit-print-color-adjust:exact;print-color-adjust:exact}
table.kp td.c,table.kp th.c{text-align:center}
.kp-blok{page-break-inside:avoid}
.kp-ttd{display:flex;justify-content:space-between;gap:30px;margin-top:40px;font-size:12px}
.kp-ttd div{flex:1;border-top:1px dotted #000;padding-top:4px}
.kp-nota{font-size:10px;margin-top:14px;border-top:1px solid #000;padding-top:6px}
@media print{
  @page{size:A4;margin:12mm}
  body>*:not(#cetak){display:none!important}
  #cetak{position:static;display:block!important;overflow:visible}
  #cetak .alat{display:none}
  #cetak .kertas{max-width:none;padding:0}
  .kp-usia.baru{page-break-before:always}
}
</style>
</head>
<body>
<div id="app"><div style="min-height:80vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;color:#9097A3;font:15px system-ui,sans-serif">
<img src="logo.png" alt="" style="width:110px;height:110px;border-radius:50%;background:#fff;box-shadow:0 0 0 3px #E2B55A">
<div>Memuatkan...</div></div></div>
<div id="modal"><div class="isi" id="modalIsi"></div></div>
<div id="toast"></div>
<div id="cetak"></div>
<script src="bersama.js"></script>
<script>
/* ====== TETAPAN: URL Web App Apps Script ====== */
const API_URL = 'https://script.google.com/macros/s/AKfycbwYLSghcfcLVKLg2plYc9Slj8E0KuNu8LX7HOugVTSIWxwCfv2hcBZB_l0uc5JArfxV/exec';

const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const tag = (s, w) => s ? `<span class="tag t-${esc(w || String(s).split(' ')[0])}">${esc(s)}</span>` : '';
let S = { token: localStorage.getItem('sp_token') || '', u: null, negeri: [], tab: '', tahun: String(new Date().getFullYear()), gelPilih: '' };
const NAMA_PERANAN = { SUPER_ADMIN: 'Super Admin', ADMIN_NEGERI: 'Admin Negeri', JURULATIH: 'Jurulatih' };
const BULAN_PENUH = ['','JANUARI','FEBRUARI','MAC','APRIL','MEI','JUN','JULAI','OGOS','SEPTEMBER','OKTOBER','NOVEMBER','DISEMBER'];
const hariIniStr = () => { const d = new Date(); return new Date(d - d.getTimezoneOffset() * 60000).toISOString().slice(0, 10); };
const rm = n => 'RM' + Number(n || 0).toFixed(2);
const tarikhMY = t => t && t.length >= 10 ? `${t.slice(8, 10)}/${t.slice(5, 7)}/${t.slice(0, 4)}` : (t || '');

function toast(m, ms) { const t = $('#toast'); t.textContent = m; t.style.display = 'block'; clearTimeout(toast.h); toast.h = setTimeout(() => t.style.display = 'none', ms || 3500); }
function modal(html) { $('#modalIsi').innerHTML = html; $('#modal').style.display = html ? 'flex' : 'none'; document.body.style.overflow = html ? 'hidden' : ''; }
$('#modal').addEventListener('click', e => { if (e.target.id === 'modal') modal(''); });

async function api(action, data) {
  const body = JSON.stringify(Object.assign({ action, token: S.token }, data || {}));
  let r;
  try {
    const res = await fetchMasa(API_URL, { method: 'POST', credentials: 'omit', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body });
    r = await res.json();
  } catch (e) {
    try {
      const res = await fetchMasa(API_URL + '?p=' + encodeURIComponent(body), { credentials: 'omit' });
      r = await res.json();
    } catch (e2) { r = { ok: false, msg: 'Tiada sambungan ke pelayan. Semak internet.' }; }
  }
  if (r.logout) keluar(true);
  return r;
}
const memuat = () => { const i = $('#isi'); if (i) i.innerHTML = '<p class="pudar" style="text-align:center;padding:30px 0">Memuatkan...</p>'; };

/* ================= LOG MASUK / DAFTAR ================= */
async function paparLogin() {
  const st = await api('status_awal');
  if (st.ok && st.perluSuper) return paparCiptaSuper();
  $('#app').innerHTML = `<div class="wrap"><div class="login">
    <div class="logo"><img src="logo.png" alt="Logo Sri Gayong Panglima Ulung"></div>
    <h1>SilatApp Pusat</h1><p class="pudar" style="text-align:center;margin-top:0">Sri Gayong Panglima Ulung</p>
    <div class="kad" id="kotakLogin">
      <label style="margin-top:0">ID Pengguna</label><input id="lId" autocomplete="username" autocapitalize="none">
      <label>Kata Laluan</label><input id="lPw" type="password" autocomplete="current-password">
      <button class="utama penuh" style="margin-top:16px" onclick="logMasuk()">Log Masuk</button>
      <p class="pudar" style="text-align:center;margin-bottom:0">Jurulatih baharu? <a href="#" onclick="paparDaftar();return false">Daftar di sini</a></p>
    </div></div></div>`;
  $('#lPw').addEventListener('keydown', e => { if (e.key === 'Enter') logMasuk(); });
}
function paparCiptaSuper() {
  $('#app').innerHTML = `<div class="wrap"><div class="login">
    <div class="logo"><img src="logo.png" alt="Logo"></div>
    <h1>Selamat Datang</h1><p class="pudar" style="text-align:center;margin-top:0">Langkah pertama: cipta akaun Super Admin anda (sekali sahaja).</p>
    <div class="kad" id="kotakSuper">
      <label style="margin-top:0">ID Pengguna</label><input id="sId" value="superadmin" autocapitalize="none">
      <label>Nama Penuh</label><input id="sNama">
      <label>No. Telefon</label><input id="sTel" inputmode="tel">
      <label>Kata Laluan (min. 8 aksara)</label><input id="sPw" type="password">
      <label>Ulang Kata Laluan</label><input id="sPw2" type="password">
      <button class="utama penuh" style="margin-top:16px" onclick="ciptaSuper()">Cipta Akaun</button>
    </div></div></div>`;
}
async function ciptaSuper() {
  if ($('#sPw').value !== $('#sPw2').value) return toast('Kata laluan tidak sama.');
  const k = $('#kotakSuper'); k.classList.add('muat');
  const r = await api('cipta_super', { id: $('#sId').value, nama: $('#sNama').value, telefon: $('#sTel').value, katalaluan: $('#sPw').value });
  k.classList.remove('muat'); toast(r.msg, 5000);
  if (r.ok) paparLogin();
}
async function logMasuk() {
  const k = $('#kotakLogin'); k.classList.add('muat');
  const r = await api('login', { id: $('#lId').value, katalaluan: $('#lPw').value });
  k.classList.remove('muat');
  if (!r.ok) return toast(r.msg);
  S.token = r.token; localStorage.setItem('sp_token', r.token); S.u = r.pengguna; S.tab = ''; mula();
}
async function paparDaftar() {
  $('#app').innerHTML = `<div class="wrap"><div class="login"><div class="logo"><img src="logo.png" alt=""></div>
    <h1>Daftar Jurulatih</h1><div class="kad" id="kotakDaftar"><p class="pudar">Memuatkan...</p></div></div></div>`;
  const r = await api('negeri');
  if (!r.ok) return toast(r.msg);
  S.negeri = r.negeri; S.gelAwam = r.gelanggang;
  $('#kotakDaftar').innerHTML = `
    <label style="margin-top:0">ID Pengguna (huruf kecil/nombor, 4–30 aksara)</label><input id="dId" autocapitalize="none">
    <label>Kata Laluan (min. 8 aksara)</label><input id="dPw" type="password">
    <label>Nama Penuh</label><input id="dNama">
    <label>No. Telefon</label><input id="dTel" inputmode="tel">
    <label>Negeri</label><select id="dNeg" onchange="isiGelDaftar()"><option value="">— Pilih negeri —</option>${S.negeri.map(n => `<option value="${n[0]}">${esc(n[1])}</option>`).join('')}</select>
    <label>Gelanggang</label><select id="dGel" onchange="$('#gelBaru').style.display=this.value==='__BARU'?'block':'none'"><option value="">— Pilih negeri dahulu —</option></select>
    <div id="gelBaru" style="display:none">
      <label>Nama Gelanggang Baharu</label><input id="dGNama">
      <label>Alamat Gelanggang</label><textarea id="dGAlamat" rows="2"></textarea>
      <p class="pudar" style="font-size:13px">Anda akan ditanda sebagai KETUA gelanggang ini.</p>
    </div>
    <div class="pdpa"><b>Notis PDPA:</b> Maklumat peribadi anda (nama, telefon) dikumpul hanya untuk urusan pentadbiran persatuan silat, disimpan secara selamat dan tidak didedahkan kepada pihak luar, selaras Akta Perlindungan Data Peribadi 2010.</div>
    <label class="cek"><input type="checkbox" id="dPdpa"> Saya faham dan bersetuju dengan notis PDPA di atas.</label>
    <div style="margin-top:16px" class="baris"><button onclick="paparLogin()">Kembali</button><button class="utama" onclick="hantarDaftar()">Hantar</button></div>`;
}
function isiGelDaftar() {
  const n = $('#dNeg').value, l = S.gelAwam.filter(g => g.negeri === n);
  $('#dGel').innerHTML = `<option value="">— Pilih gelanggang —</option>` + l.map(g => `<option value="${esc(g.kod)}">${esc(g.nama)} (${esc(g.kod)})</option>`).join('') + `<option value="__BARU">+ Mohon gelanggang baharu</option>`;
  $('#gelBaru').style.display = 'none';
}
async function hantarDaftar() {
  const gel = $('#dGel').value;
  const d = { id: $('#dId').value, katalaluan: $('#dPw').value, nama: $('#dNama').value, telefon: $('#dTel').value, negeri: $('#dNeg').value, pdpa: $('#dPdpa').checked };
  if (gel === '__BARU') d.gelanggang_baru = { nama: $('#dGNama').value, alamat: $('#dGAlamat').value };
  else d.kod_gelanggang = gel;
  const k = $('#kotakDaftar'); k.classList.add('muat');
  const r = await api('daftar', d); k.classList.remove('muat');
  toast(r.msg, 6000);
  if (r.ok) paparLogin();
}
async function keluar(senyap) {
  if (!senyap && S.token) api('logout');
  S.token = ''; S.u = null; S.tab = ''; localStorage.removeItem('sp_token'); paparLogin();
}

/* ================= KERANGKA UTAMA ================= */
const MENU_JUR = [
  ['ahli', '👥', 'Ahli', 'Senarai & kad ahli'],
  ['mohon', '📝', 'Permohonan', 'Borang online & kelulusan'],
  ['daftar', '➕', 'Daftar Ahli', 'Pendaftaran manual'],

function gabungStat(list) {
  const t = { n: 0, L: 0, P: 0, K: 0, M: 0, D: 0, X: 0, b: BENGKUNG.map(() => 0), lain: 0 };
  list.forEach(st => { ['L', 'P', 'K', 'M', 'D', 'X'].forEach(k => t[k] += st[k] || 0);
    Object.entries(st.b || {}).forEach(([nm, c]) => { const i = indeksBengkung(nm); if (i >= 0) t.b[i] += c; else t.lain += c; }); });
  t.n = t.L + t.P; return t;
}

function pdpaAhli() {
  return `<div class="pdpa"><b>Notis PDPA:</b> Maklumat ahli digunakan hanya untuk pentadbiran keahlian silat. No. KP dipaparkan separa kepada pihak lain.</div>
    <label class="cek"><input type="checkbox" id="aPdpa"> Ahli / ibu bapa / penjaga telah bersetuju maklumat ini disimpan.</label>`;
}
function tarikhDariKP(kp) {
  const d = String(kp).replace(/\D/g, ''); if (d.length < 6) return '';
  let y = Number(d.slice(0, 2)); const now = new Date().getFullYear() % 100; y = y > now ? 1900 + y : 2000 + y;
  return `${y}-${d.slice(2, 4)}-${d.slice(4, 6)}`;
}
async function hantarAhli(mod) {
  const d = { no_kp: $('#aKP').value };
  if (!mod) Object.assign(d, { nama: $('#aNama').value, jantina: $('#aJan').value, tarikh_lahir: $('#aLahir').value, bengkung: $('#aBeng').value, tel_waris: $('#aWaris').value });
  if ($('#aCaw')) d.cawangan = $('#aCaw').value; else if (S.cawPilih && S.cawPilih !== '__TIADA') d.cawangan = S.cawPilih;
  const k = $('#kotakAhli'); k.classList.add('muat');
  const r = await api('daftar_ahli', { data: d, mod, kod: S.gelPilih, pdpa: $('#aPdpa').checked });
  k.classList.remove('muat'); toast(r.msg, 5000);
  if (r.ok) tabDaftar();
}

/* ================= MODUL GELANGGANG (jurulatih sahaja) ================= */
async function muatAhliJur(semuaCaw) {
  const [r, c] = await Promise.all([api('senarai_ahli', { tahun: S.tahun }), api('caw_get')]);
  if (!r.ok) { $('#isi').innerHTML = `<p>${esc(r.msg)}</p>`; return null; }
  S.ahli = r.ahli; S.gelAhli = r.gelanggang; S.cawList = c.ok ? c.cawangan : [];
  if (S.cawPilih == null) { try { S.cawPilih = localStorage.getItem('sp_caw') || ''; } catch (e) { S.cawPilih = ''; } }
  if (S.cawPilih && S.cawPilih !== '__TIADA' && !S.cawList.some(x => x.id === S.cawPilih)) S.cawPilih = '';
  return r.ahli.filter(a => a.status_gel === 'AKTIF' && (semuaCaw || ikutCaw(a)));
}
/* --- Cawangan (lokasi latihan di bawah gelanggang induk) --- */
const ikutCaw = a => !S.cawPilih || (S.cawPilih === '__TIADA' ? !a.cawangan : a.cawangan === S.cawPilih);
const namaCaw = id => ((S.cawList || []).find(c => c.id === id) || {}).nama || '';
function pilihCaw(fn) {
  if (!(S.cawList || []).length) return '';
  return `<select style="margin-bottom:12px;border-color:var(--emas)" onchange="S.cawPilih=this.value;try{localStorage.setItem('sp_caw',this.value)}catch(e){};${fn}()">
    <option value="">🏟️ Semua cawangan</option>${S.cawList.map(c => `<option value="${esc(c.id)}" ${c.id === S.cawPilih ? 'selected' : ''}>📍 ${esc(c.nama)}</option>`).join('')}
    <option value="__TIADA" ${S.cawPilih === '__TIADA' ? 'selected' : ''}>— Belum ditag cawangan</option></select>`;
}
const logoGel = () => (S.u && S.u.logo) || 'logo.png';
const nota = '<p class="pudar" style="font-size:12px;text-align:center">🔒 Data ini hanya untuk gelanggang anda — tidak dihantar kepada Admin Negeri / Super Admin.</p>';
function ringkasan(besar, kiri, kanan, peratus) {
  return `<div class="ring"><div class="besar">${besar}</div><div class="sub"><span>${kiri}</span><span style="color:var(--merah);font-weight:700">${kanan}</span></div>
    <div class="bar"><i style="width:${Math.max(0, Math.min(100, peratus))}%"></i></div></div>`;
}

/* ---- Kehadiran ---- */
async function tabHadir() {
  const ahli = await muatAhliJur(); if (!ahli) return;
  S.hTarikh = S.hTarikh || hariIniStr();
  const h = await api('hadir_get', { tarikh: S.hTarikh, cawangan: S.cawPilih });
  S.hSet = new Set(h.hadir || []); S.hAhli = ahli; S.hTapis = S.hTapis || 'semua'; S.hAda = h.ada;
  $('#isi').innerHTML = `${pilihCaw('tabHadir')}<input type="date" value="${esc(S.hTarikh)}" onchange="S.hTarikh=this.value;tabHadir()" style="margin-bottom:12px">
    <div id="ringH"></div>
    <div class="baris" style="margin-bottom:6px"><button class="kecil" onclick="S.hAhli.forEach(a=>S.hSet.add(a.no_kp));lukisHadir()">✓ Tanda semua</button><button class="kecil" onclick="S.hSet.clear();lukisHadir()">Kosongkan</button></div>
    ${cariBox('cariH', 'lukisHadir')}<div id="cipH"></div><div id="senH"></div>
    <input id="hCat" placeholder="Catatan latihan (pilihan)" value="${esc(h.catatan || '')}" style="margin-top:6px">
    <button class="kecil" style="margin-top:14px" onclick="laporanHadir()">📊 Laporan bulanan</button>${nota}
    <div class="terapung"><div><button class="utama penuh" onclick="simpanHadir()">Simpan Kehadiran</button></div></div>`;
  lukisHadir();
}
function lukisHadir() {
  const n = S.hAhli.filter(a => S.hSet.has(a.no_kp)).length, t = S.hAhli.length;
  $('#ringH').innerHTML = ringkasan(`${n} <span style="font-size:16px" class="pudar">/ ${t} hadir</span>`, `${tarikhMY(S.hTarikh)} · ${S.hAda ? 'sudah direkod' : 'belum direkod'}`, `${t - n} tidak hadir`, t ? n / t * 100 : 0);
  $('#cipH').innerHTML = cip('hTapis', [['semua', `Semua (${t})`], ['hadir', `Hadir (${n})`], ['tidak', `Tidak (${t - n})`]], S.hTapis, 'lukisHadir');
  const q = ($('#cariH').value || '').toLowerCase();
  const l = S.hAhli.filter(a => a.nama.toLowerCase().includes(q) && (S.hTapis === 'semua' || (S.hTapis === 'hadir') === S.hSet.has(a.no_kp)));
  $('#senH').innerHTML = l.map(a => `<div class="item ${S.hSet.has(a.no_kp) ? 'on' : ''}" onclick="togolH('${esc(a.no_kp)}')"><div class="k"><b>${esc(a.nama)}</b><small>${esc(namaBengkung(a.bengkung) || a.no_ahli)}</small></div><div class="semak">✓</div></div>`).join('') || '<p class="pudar">Tiada.</p>';
}
function togolH(kp) { S.hSet.has(kp) ? S.hSet.delete(kp) : S.hSet.add(kp); lukisHadir(); }
async function simpanHadir() {
  const r = await api('hadir_simpan', { tarikh: S.hTarikh, cawangan: S.cawPilih, hadir: [...S.hSet].filter(kp => S.hAhli.some(a => a.no_kp === kp)), catatan: $('#hCat').value }); toast(r.msg); if (r.ok) tabHadir();
}
async function laporanHadir() {
  const d = new Date(); S.lBulan = S.lBulan || d.getMonth() + 1; S.lTahun = S.lTahun || d.getFullYear();
  modal('<p class="pudar">Memuatkan...</p>');
  const lap = await api('hadir_laporan', { bulan: S.lBulan, tahun: S.lTahun, cawangan: S.cawPilih });
  const bs = (lap.sesi || []).length;
  modal(`<h3 style="color:var(--emas);margin-top:0">Laporan Kehadiran</h3>
    <div class="baris"><div>${pilihBulan('laporanHadir', S.lBulan, 'lBulan')}</div><div style="flex:none;width:110px">${pilihTahun('laporanHadir', S.lTahun, 'lTahun')}</div></div>
    <p class="pudar" style="font-size:14px">${bs} sesi latihan${bs ? ': ' + lap.sesi.map(x => `${x.tarikh.slice(8)}hb (${x.bil})`).join(', ') : ''}</p>
    ${S.hAhli.map(a => { const n = (lap.bil || {})[a.no_kp] || 0, pc = bs ? Math.round(n / bs * 100) : 0, w = pc >= 75 ? 'HIJAU' : pc >= 50 ? 'KUNING' : 'MERAH';
      return `<div class="item" style="cursor:default"><div class="k"><b>${esc(a.nama)}</b><small>${n} / ${bs} sesi</small></div>${tag(pc + '%', w)}</div>`; }).join('')}
    <button class="penuh" onclick="modal('')">Tutup</button>`);
}

/* ---- Yuran bulanan + pengecualian ---- */
const ymKey = () => `${S.ybTahun}-${String(S.ybBulan).padStart(2, '0')}`;
const bulanKec = () => (S.kec || []).find(k => k.jenis === 'BULAN' && k.mula === ymKey());
const ahliKec = kp => (S.kec || []).find(k => k.jenis === 'AHLI' && k.no_kp === kp && k.mula <= ymKey() && (!k.tamat || k.tamat >= ymKey()));
const labelYM = ym => ym ? `${BULAN_PENUH[+ym.slice(5)].slice(0, 3)} ${ym.slice(0, 4)}` : '';
async function tabYB() {
  const ahli = await muatAhliJur(); if (!ahli) return;
  const d = new Date(); S.ybBulan = S.ybBulan || d.getMonth() + 1; S.ybTahun = S.ybTahun || d.getFullYear();
  const [r, k] = await Promise.all([api('yb_get', { tahun: S.ybTahun }), api('kec_get')]); if (!r.ok) return toast(r.msg);
  S.yb = {}; r.bayaran.forEach(b => S.yb[b.no_kp + '|' + b.bulan] = b);
  S.kec = k.ok ? k.senarai : [];
  S.ybAhli = ahli; S.ybTapis = S.ybTapis || 'semua';
  $('#isi').innerHTML = `${pilihCaw('tabYB')}<div class="baris" style="margin-bottom:12px"><div>${pilihBulan('tabYB', S.ybBulan, 'ybBulan')}</div><div style="flex:none;width:120px">${pilihTahun('tabYB', S.ybTahun, 'ybTahun')}</div></div>
    <div id="ringYB"></div><div id="kecYB"></div>${cariBox('cariYB', 'lukisYB')}<div id="cipYB"></div><div id="senYB"></div>${nota}`;
  lukisYB();
}
function lukisYB() {
  const sudah = a => S.yb[a.no_kp + '|' + S.ybBulan], bk = bulanKec();
  const kecuali = S.ybAhli.filter(a => !sudah(a) && ahliKec(a.no_kp));
  const wajib = S.ybAhli.filter(a => !kecuali.includes(a));
  const n = wajib.filter(sudah).length, t = wajib.length;
  const jum = S.ybAhli.reduce((x, a) => x + (sudah(a) ? Number(sudah(a).jumlah || 0) : 0), 0);
  $('#ringYB').innerHTML = bk
    ? `<div class="ring" style="border-color:#4c3d7a"><div class="besar">${rm(jum)}</div><div class="sub"><span>📅 ${BULAN_PENUH[S.ybBulan]} dikecualikan${bk.sebab ? ' — ' + esc(bk.sebab) : ''}</span></div><div class="pudar" style="font-size:13px">Tiada yuran wajib bulan ini.</div></div>`
    : ringkasan(rm(jum), `${n} / ${t} orang bayar${kecuali.length ? ` · ${kecuali.length} dikecualikan` : ''}`, `${t - n} belum bayar`, t ? n / t * 100 : 0);
  const kecAhliAktif = (S.kec || []).filter(k => k.jenis === 'AHLI' && (!k.tamat || k.tamat >= ymKey())).length;
  $('#kecYB').innerHTML = `<label class="cek" style="margin:0 0 10px;color:var(--pudar)"><input type="checkbox" ${bk ? 'checked' : ''} onchange="togolBulanKec(this)"> 📅 Kecualikan bulan ini (cuti / tanpa yuran)</label>
    <button class="penuh" style="text-align:left;border-color:#4c3d7a;background:#1d1830;color:#B9A4FF;font-weight:700;margin-bottom:12px" onclick="paparKecAhli()">💜 Pengecualian khas pesilat${kecAhliAktif ? ` (${kecAhliAktif})` : ''}</button>`;
  const cipL = [['semua', `Semua (${S.ybAhli.length})`], ['belum', `Belum (${bk ? 0 : t - n})`], ['sudah', `Sudah (${S.ybAhli.filter(sudah).length})`]];
  if (kecuali.length) cipL.push(['kecuali', `Dikecualikan (${kecuali.length})`]);
  $('#cipYB').innerHTML = cip('ybTapis', cipL, S.ybTapis, 'lukisYB');
  const q = ($('#cariYB').value || '').toLowerCase();
  const padan = a => S.ybTapis === 'semua' || (S.ybTapis === 'sudah' && sudah(a)) || (S.ybTapis === 'kecuali' && kecuali.includes(a))
    || (S.ybTapis === 'belum' && !bk && !sudah(a) && !kecuali.includes(a));
  const l = S.ybAhli.map((a, i) => [a, i]).filter(([a]) => a.nama.toLowerCase().includes(q) && padan(a));
  $('#senYB').innerHTML = l.map(([a, i]) => { const b = sudah(a), ke = !b && ahliKec(a.no_kp);
    const kanan = b ? `${tag('RM' + Number(b.jumlah || 0).toFixed(0), 'HIJAU')}<span class="pudar">✎</span>`
      : ke ? `<span class="tag" style="background:#2a2140;color:#B9A4FF">DIKECUALIKAN</span>`
      : bk ? `<span class="tag t-TIDAK">CUTI</span>`
      : `<button class="utama kecil" style="min-height:42px;padding:8px 16px">+ Rekod</button>`;
    return `<div class="item" onclick="bukaYB(${i})"><div class="k"><b>${esc(a.nama)}</b><small>${esc(namaBengkung(a.bengkung) || a.no_ahli)}${b ? ' · ' + tarikhMY(b.tarikh) : ke && ke.sebab ? ' · ' + esc(ke.sebab) : ''}</small></div><div class="r">${kanan}</div></div>`; }).join('') || '<p class="pudar">Tiada.</p>';
}
async function togolBulanKec(el) {
  const bk = bulanKec();
  if (bk) {
    if (!confirm(`Batalkan pengecualian ${BULAN_PENUH[S.ybBulan]} ${S.ybTahun}?`)) { el.checked = true; return; }
    const r = await api('kec_padam', { id: bk.id }); toast(r.msg); if (r.ok) S.kec = S.kec.filter(k => k.id !== bk.id);
  } else {
    const sebab = prompt(`Sebab ${BULAN_PENUH[S.ybBulan]} ${S.ybTahun} dikecualikan? (cth. Cuti sekolah, Ramadan)`, '');
    if (sebab === null) { el.checked = false; return; }
    const r = await api('kec_simpan', { jenis: 'BULAN', mula: ymKey(), sebab }); toast(r.msg);
    if (r.ok) { const k = await api('kec_get'); S.kec = k.senarai || []; }
  }
  lukisYB();
}
function paparKecAhli() {
  const nama = {}; S.ybAhli.forEach(a => nama[a.no_kp] = a.nama);
  const l = (S.kec || []).filter(k => k.jenis === 'AHLI');
  const y = S.ybTahun, opsBulan = (id, v) => `<select id="${id}"><option value="">${id === 'keTamat' ? 'Berterusan' : '— Bulan —'}</option>${[y - 1, y, y + 1].flatMap(t => BULAN_PENUH.slice(1).map((b, i) => { const k = `${t}-${String(i + 1).padStart(2, '0')}`; return `<option value="${k}" ${k === v ? 'selected' : ''}>${b.slice(0, 3)} ${t}</option>`; })).join('')}</select>`;
  modal(`<h3 style="color:#B9A4FF;margin-top:0">💜 Pengecualian Khas Pesilat</h3>
    <p class="pudar" style="font-size:13px;margin-top:0">Pesilat yang dikecualikan tidak dikira "belum bayar" (cth. anak yatim, asnaf, anak jurulatih).</p>
    ${l.map(k => `<div class="item" style="cursor:default"><div class="k"><b>${esc(nama[k.no_kp] || k.no_kp)}</b><small>${esc(k.sebab || '-')} · ${labelYM(k.mula)} → ${k.tamat ? labelYM(k.tamat) : 'berterusan'}</small></div><button class="kecil bahaya" onclick="padamKec('${esc(k.id)}')">Batal</button></div>`).join('') || '<p class="pudar">Tiada pengecualian lagi.</p>'}
    <h3 style="color:var(--emas);font-size:15px;margin:16px 0 0">Tambah pengecualian</h3>
    <label>Pesilat</label><select id="keKp">${S.ybAhli.map(a => `<option value="${esc(a.no_kp)}">${esc(a.nama)}</option>`).join('')}</select>
    <label>Sebab</label><input id="keSebab" list="keL" placeholder="cth. Anak yatim"><datalist id="keL"><option>Anak yatim</option><option>Asnaf / B40</option><option>Anak jurulatih</option><option>Adik-beradik</option><option>Biasiswa gelanggang</option></datalist>
    <div class="baris"><div><label>Mula</label>${opsBulan('keMula', ymKey())}</div><div><label>Hingga</label>${opsBulan('keTamat', '')}</div></div>
    <button class="utama penuh" style="margin-top:14px" onclick="simpanKec()">Simpan Pengecualian</button>
    <button class="penuh" style="margin-top:8px" onclick="modal('')">Tutup</button>`);
}
async function simpanKec() {
  const r = await api('kec_simpan', { jenis: 'AHLI', no_kp: $('#keKp').value, sebab: $('#keSebab').value, mula: $('#keMula').value, tamat: $('#keTamat').value });
  toast(r.msg); if (r.ok) { const k = await api('kec_get'); S.kec = k.senarai || []; lukisYB(); paparKecAhli(); }
}
async function padamKec(id) {
  if (!confirm('Batalkan pengecualian ini?')) return;
  const r = await api('kec_padam', { id }); toast(r.msg); if (r.ok) { S.kec = S.kec.filter(k => k.id !== id); lukisYB(); paparKecAhli(); }
}
function bukaYB(i) {
  const a = S.ybAhli[i], bulan = S.ybBulan, b = S.yb[a.no_kp + '|' + bulan];
  S.ybPilih = { a, bulan };
  let lalai = ''; try { lalai = localStorage.getItem('sp_yb') || ''; } catch (e) {}
  modal(`<h3 style="color:var(--emas);margin:0">Yuran ${BULAN_PENUH[bulan]} ${S.ybTahun}</h3><p style="margin:6px 0 0"><b>${esc(a.nama)}</b><br><small class="pudar">${esc(a.no_ahli)}</small></p>
    <label>Jumlah (RM)</label><input id="ybJum" class="besarInput" inputmode="decimal" value="${esc(b ? b.jumlah : lalai)}">
    <label>Tarikh bayar</label><input type="date" id="ybTarikh" value="${esc(b ? b.tarikh : hariIniStr())}">
    <label>Kaedah</label><div class="cip" id="ybK">${['TUNAI','ONLINE','QR'].map(k => `<button class="${(b ? b.kaedah : 'TUNAI') === k ? 'on' : ''}" onclick="document.querySelectorAll('#ybK button').forEach(x=>x.classList.remove('on'));this.classList.add('on')">${k}</button>`).join('')}</div>
    <button class="utama penuh" onclick="simpanYB()">Simpan</button>
    <div class="baris" style="margin-top:8px">${b ? `<button class="bahaya" onclick="padamYB()">Padam</button>` : ''}<button onclick="modal('')">Batal</button></div>`);
}
async function simpanYB() {
  const { a, bulan } = S.ybPilih; try { localStorage.setItem('sp_yb', $('#ybJum').value); } catch (e) {}
  const kaedah = ($('#ybK .on') || {}).textContent || 'TUNAI';
  const r = await api('yb_simpan', { no_kp: a.no_kp, bulan, tahun: S.ybTahun, jumlah: $('#ybJum').value, tarikh: $('#ybTarikh').value, kaedah });
  toast(r.msg); if (r.ok) { S.yb[a.no_kp + '|' + bulan] = { jumlah: $('#ybJum').value, tarikh: $('#ybTarikh').value, kaedah }; modal(''); lukisYB(); }
}
async function padamYB() {
  if (!confirm('Padam rekod bayaran ini?')) return;
  const { a, bulan } = S.ybPilih; const r = await api('yb_padam', { no_kp: a.no_kp, bulan, tahun: S.ybTahun });
  toast(r.msg); if (r.ok) { modal(''); delete S.yb[a.no_kp + '|' + bulan]; lukisYB(); }
}

/* ---- Kewangan ---- */
async function tabKew() {
  S.kTahun = S.kTahun || new Date().getFullYear(); S.kTapis = S.kTapis || 'semua';
  const r = await api('kew_get', { tahun: S.kTahun }); if (!r.ok) return $('#isi').innerHTML = `<p>${esc(r.msg)}</p>`;
  S.kew = r;
  const masukLain = r.rekod.filter(x => x.jenis === 'MASUK').reduce((a, x) => a + x.jumlah, 0);

    <div class="grid" style="margin-bottom:12px"><div class="stat"><b style="color:var(--hijau);font-size:18px">${rm(masuk)}</b><small>Masuk ${S.kTahun}</small></div>
      <div class="stat"><b style="color:var(--merah);font-size:18px">${rm(keluar)}</b><small>Keluar ${S.kTahun}</small></div></div>
    <div class="kotakHasil" style="margin:0 0 12px"><div class="bar2"><span class="pudar">Yuran bulanan</span><b>${rm(yb)}</b></div><div class="bar2"><span class="pudar">Yuran tahunan</span><b>${rm(r.yuranTahunan)}</b></div><div class="bar2"><span class="pudar">Terimaan lain</span><b>${rm(masukLain)}</b></div></div>
    ${cip('kTapis', [['semua', 'Semua'], ['MASUK', 'Masuk'], ['KELUAR', 'Keluar']], S.kTapis, 'tabKew')}
    ${r.rekod.filter(x => S.kTapis === 'semua' || x.jenis === S.kTapis).map(x => `<div class="item" onclick="padamKew('${esc(x.id)}')"><div class="k"><b style="text-transform:none">${esc(x.kategori || x.jenis)}</b><small>${esc(tarikhMY(x.tarikh))}${x.keterangan ? ' · ' + esc(x.keterangan) : ''}</small></div>
      <div class="r"><b style="color:${x.jenis === 'MASUK' ? 'var(--hijau)' : 'var(--merah)'}">${x.jenis === 'MASUK' ? '+' : '−'}${rm(x.jumlah)}</b></div></div>`).join('') || '<p class="pudar">Tiada rekod. (Yuran dikira automatik.)</p>'}
    <button class="kecil" onclick="eksportKew()">Eksport CSV</button>${nota}
    <div class="terapung"><div><button class="utama penuh" onclick="borangKew()">+ Tambah Rekod</button></div></div>`;
}

async function simpanKew() {

  const r = S.kew, rows = [['Tarikh','Jenis','Kategori','Keterangan','Jumlah (RM)']].concat(r.rekod.map(x => [x.tarikh, x.jenis, x.kategori, x.keterangan, x.jumlah]));

  csv('kewangan_' + S.kTahun, rows);
}

/* ---- Fizikal & BMI: kategori usia, kelas berat, BMI & berat ideal ---- */
function umurTahunIni(a) { const y = Number(String(a.tarikh_lahir || '').slice(0, 4)) || Number(tarikhDariKP(a.no_kp).slice(0, 4)); return y ? new Date().getFullYear() - y : null; }
async function tabFiz() {
  const ahli = await muatAhliJur(); if (!ahli) return;
  const r = await api('fiz_get'); if (!r.ok) return toast(r.msg);
  S.fizTerkini = {}; r.rekod.forEach(f => { if (!S.fizTerkini[f.no_kp]) S.fizTerkini[f.no_kp] = f; });
  S.fizAhli = ahli.map(a => { const u = umurTahunIni(a); return Object.assign({}, a, { umur: u, kat: kategoriUsia(u) }); });
  S.fTapis = S.fTapis || 'semua';
  $('#isi').innerHTML = `${pilihCaw('tabFiz')}<div class="ring"><div class="pudar" style="font-size:14px">Kategori usia tahun ${new Date().getFullYear()}</div>
    <div style="display:flex;flex-wrap:wrap;gap:6px;margin-top:8px">${KATEGORI_USIA.map(k => { const n = S.fizAhli.filter(a => a.kat.includes(k)).length; return n ? tag(`${k.nama} (${k.umur}): ${n}`, 'BIRU') : ''; }).join('')}</div></div>
    <button class="utama penuh" style="margin-bottom:12px" onclick="cetakKelas()">🖨️ Muat Turun Senarai Kelas Berat</button>
    ${cariBox('cariF', 'lukisFiz')}<div id="cipF"></div><div id="senF"></div>${nota}`;
  lukisFiz();
}
function lukisFiz() {
  const kats = KATEGORI_USIA.filter(k => S.fizAhli.some(a => a.kat.includes(k)));
  $('#cipF').innerHTML = cip('fTapis', [['semua', 'Semua']].concat(kats.map(k => [k.nama, k.nama])), S.fTapis, 'lukisFiz');
  const q = ($('#cariF').value || '').toLowerCase();
  $('#senF').innerHTML = S.fizAhli.map((a, i) => [a, i]).filter(([a]) => a.nama.toLowerCase().includes(q) && (S.fTapis === 'semua' || a.kat.some(k => k.nama === S.fTapis))).map(([a, i]) => {
    const f = S.fizTerkini[a.no_kp], brt = f ? +f.berat : 0, b = f ? infoBMI(brt, +f.tinggi) : null;
    const lbl = t => `<span class="pudar" style="font-size:11px;display:block;margin-bottom:3px">${t}</span>`;
    const usia = a.kat.length ? a.kat.map(k => tag(k.nama, 'BIRU')).join(' ') : tag(a.umur == null ? 'TIADA TARIKH LAHIR' : 'TIADA KATEGORI', 'TIDAK');
    const berat = !brt ? '<span class="pudar" style="font-size:13px">—</span>'
      : a.kat.length ? a.kat.map(k => `<span class="tag" style="background:#3a321f;color:var(--emas)">${a.kat.length > 1 ? esc(k.nama.split(' ')[0]) + ': ' : ''}${esc(kelasBerat(k, brt).replace('Kelas ', ''))}</span>`).join(' ') : '<span class="pudar" style="font-size:13px">—</span>';
    return `<div class="item" style="display:block" onclick="bukaFiz(${i})">
      <div class="baris" style="align-items:flex-start"><div class="k" style="flex:1"><b>${esc(a.nama)}</b><small>${a.umur != null ? a.umur + ' tahun' : 'Umur tidak diketahui'}${brt ? ` · ${esc(f.berat)} kg${f.tinggi ? ' · ' + esc(f.tinggi) + ' cm' : ''}` : ''}</small></div>
        ${f ? '<span class="pudar" style="flex:none">✎</span>' : '<button class="utama kecil" style="flex:none;min-height:38px">+ Rekod</button>'}</div>
      <div class="fizgrid">
        <div>${lbl('KELAS USIA')}${usia}</div>
        <div>${lbl('KELAS BERAT')}${berat}</div>
        <div>${lbl('BMI')}${b ? tag(b.bmi + ' · ' + b.k, b.w) : '<span class="pudar" style="font-size:13px">—</span>'}</div>
      </div></div>`; }).join('') || '<p class="pudar">Tiada.</p>';
}
function bukaFiz(i) {
  const a = S.fizAhli[i], f = S.fizTerkini[a.no_kp]; S.fPilih = a;
  modal(`<h3 style="color:var(--emas);margin:0">${esc(a.nama)}</h3>
    <p class="pudar" style="margin:4px 0 0">${a.umur != null ? `Umur ${a.umur} tahun (${new Date().getFullYear()}) · <b style="color:var(--teks)">${namaKat(a.kat)}</b>` : 'Tarikh lahir tiada — kemas kini di menu Ahli'}</p>
    <div class="baris"><div><label>Berat (kg)</label><input id="fBerat" class="besarInput" inputmode="decimal" value="${esc(f ? f.berat : '')}" oninput="kiraFiz()"></div>
      <div><label>Tinggi (cm)</label><input id="fTinggi" class="besarInput" inputmode="decimal" value="${esc(f ? f.tinggi : '')}" oninput="kiraFiz()"></div></div>
    <div class="kotakHasil" id="fHasil"></div>
    <button class="utama penuh" style="margin-top:14px" onclick="simpanFiz()">Simpan</button>
    <button class="penuh" style="margin-top:8px" onclick="modal('')">Tutup</button>
    ${f ? `<p class="pudar" style="font-size:13px;text-align:center">Rekod terakhir: ${esc(tarikhMY(f.tarikh))}</p>` : ''}`);
  kiraFiz();
}
function kiraFiz() {
  const a = S.fPilih, b = parseFloat($('#fBerat').value), t = parseFloat($('#fTinggi').value), info = infoBMI(b, t);
  $('#fHasil').innerHTML = (a.kat.length ? a.kat.map(k => `<div class="bar2"><span class="pudar">${esc(k.nama)} <small>(${esc(k.umur)} thn)</small></span><b style="color:var(--emas)">${b > 0 ? kelasBerat(k, b) : '-'}</b></div>`).join('')
      : `<div class="bar2"><span class="pudar">Kategori usia</span><b>Tiada kategori</b></div>`) + `
    <div class="bar2"><span class="pudar">BMI</span><b>${info ? `${info.bmi} ${tag(info.k, info.w)}` : '<span class="pudar">isi berat & tinggi</span>'}</b></div>
    <div class="bar2"><span class="pudar">Berat ideal</span><b>${info ? info.ideal : '-'}</b></div>
    <div class="bar2"><span class="pudar">Sasaran</span><b>${info ? info.beza : '-'}</b></div>`;
}
async function simpanFiz() {
  const a = S.fPilih, b = $('#fBerat').value, t = $('#fTinggi').value;
  const r = await api('fiz_simpan', { no_kp: a.no_kp, tarikh: hariIniStr(), berat: b, tinggi: t, catatan: a.kat.map(k => k.nama + ' ' + kelasBerat(k, parseFloat(b))).join('; ') });
  toast(r.msg); if (r.ok) { S.fizTerkini[a.no_kp] = { berat: b, tinggi: t, tarikh: hariIniStr() }; modal(''); lukisFiz(); }
}

/* ---- Senarai kelas berat untuk dicetak / PDF ---- */
function cetakKelas() {
  const g = S.gelAhli || {}, th = new Date().getFullYear(), kini = new Date();
  const JAN = [['L', 'LELAKI'], ['P', 'PEREMPUAN']];
  const jan = a => /^P/i.test(a.jantina) ? 'P' : 'L';
  let isi = '', ring = [], bilBelum = [], noUsia = 0;
  KATEGORI_USIA.forEach(kat => {
    const ahliK = S.fizAhli.filter(a => a.kat.includes(kat));
    if (!ahliK.length) return;
    let blokKat = '', jumKat = 0;
    JAN.forEach(([jk, jn]) => {
      const ahliJ = ahliK.filter(a => jan(a) === jk);
      if (!ahliJ.length) return;
      let blokJ = '';
      kat.kelas.forEach(kl => {
        const l = ahliJ.filter(a => { const f = S.fizTerkini[a.no_kp], b = f ? +f.berat : 0; return b > 0 && b > kl[1] && (kl[2] == null || b <= kl[2]); })
          .sort((x, y) => (+S.fizTerkini[x.no_kp].berat) - (+S.fizTerkini[y.no_kp].berat));
        if (!l.length) return;
        jumKat += l.length;
        ring.push([kat.nama, jn, kl[0].replace('Kelas ', ''), l.length]);
        blokJ += `<div class="kp-blok"><div class="kp-kelas">${esc(kl[0].toUpperCase())} &nbsp;(${kl[2] == null ? 'melebihi ' + kl[1] : kl[1] + ' – ' + kl[2]} kg) &nbsp;—&nbsp; ${l.length} orang</div>
          <table class="kp"><tr><th class="c" style="width:34px">BIL</th><th>NAMA PESILAT</th><th style="width:110px">NO. AHLI</th><th class="c" style="width:48px">UMUR</th><th class="c" style="width:62px">BERAT (kg)</th><th class="c" style="width:62px">TINGGI (cm)</th><th class="c" style="width:78px">TARIKH TIMBANG</th><th class="c" style="width:40px">✓</th></tr>
          ${l.map((a, i) => { const f = S.fizTerkini[a.no_kp]; return `<tr><td class="c">${i + 1}</td><td>${esc(a.nama)}</td><td>${esc(a.no_ahli)}</td><td class="c">${a.umur}</td><td class="c">${esc(f.berat)}</td><td class="c">${esc(f.tinggi || '-')}</td><td class="c">${esc(tarikhMY(f.tarikh))}</td><td></td></tr>`; }).join('')}</table></div>`;
      });
      const belum = ahliJ.filter(a => { const f = S.fizTerkini[a.no_kp]; return !(f && +f.berat > 0) || +f.berat <= kat.kelas[0][1]; });
      belum.forEach(a => { if (!bilBelum.includes(a)) bilBelum.push(a); });
      if (blokJ) blokKat += `<div class="kp-jan">${jn}</div>${blokJ}`;
    });
    if (blokKat) { isi += `<div class="kp-usia ${noUsia++ ? 'baru' : ''}">KATEGORI ${esc(kat.nama)} &nbsp;(${esc(kat.umur)} TAHUN) &nbsp;—&nbsp; ${jumKat} orang</div>${blokKat}`; }
  });
  if (bilBelum.length) isi += `<div class="kp-usia baru">BELUM DITIMBANG / TIADA KELAS — ${bilBelum.length} orang</div>
    <table class="kp" style="margin-top:8px"><tr><th class="c" style="width:34px">BIL</th><th>NAMA PESILAT</th><th style="width:110px">NO. AHLI</th><th class="c" style="width:48px">UMUR</th><th class="c" style="width:60px">JANTINA</th><th>KATEGORI USIA</th></tr>
    ${bilBelum.map((a, i) => `<tr><td class="c">${i + 1}</td><td>${esc(a.nama)}</td><td>${esc(a.no_ahli)}</td><td class="c">${a.umur ?? '-'}</td><td class="c">${jan(a)}</td><td>${esc(namaKat(a.kat))}</td></tr>`).join('')}</table>`;
  const ringkas = ring.length ? `<table class="kp-ring"><tr><th>KATEGORI USIA</th><th>JANTINA</th><th>KELAS</th><th>BIL.</th></tr>${ring.map(r => `<tr><td>${esc(r[0])}</td><td>${r[1]}</td><td>${esc(r[2])}</td><td>${r[3]}</td></tr>`).join('')}</table>` : '';
  const el = $('#cetak');
  el.innerHTML = `<div class="alat"><button onclick="$('#cetak').style.display='none'">← Tutup</button><button class="utama" onclick="window.print()">🖨️ Cetak / Simpan PDF</button></div>
    <div class="kertas">
      <div class="kp-head"><img src="${esc(logoGel())}" alt=""><div><h1>SRI GAYONG PANGLIMA ULUNG</h1><div class="g">${esc((g.nama || S.u.nama_gelanggang || '').toUpperCase())}</div>
        ${S.cawPilih && S.cawPilih !== '__TIADA' ? `<div class="m"><b>Cawangan: ${esc(namaCaw(S.cawPilih))}</b></div>` : ''}<div class="m">Kod Gelanggang: ${esc(g.kod || S.u.kod_gelanggang)} &nbsp;|&nbsp; Negeri: ${esc(S.u.namaNegeri || '')} &nbsp;|&nbsp; Jurulatih: ${esc(S.u.nama)}</div></div></div>
      <div class="kp-tajuk">SENARAI PESILAT MENGIKUT KATEGORI USIA, JANTINA DAN KELAS BERAT TAHUN ${th}</div>
      <div style="text-align:center;font-size:11px">Dijana pada ${kini.toLocaleDateString('ms-MY', { day: '2-digit', month: 'long', year: 'numeric' })} &nbsp;|&nbsp; Umur dikira mengikut tahun ${th}</div>
      ${ringkas}${isi || '<p>Tiada data berat pesilat lagi.</p>'}
      <div class="kp-nota">Nota: Pesilat yang umurnya berada dalam dua kategori (cth. 16 tahun: Remaja &amp; Sukma) disenaraikan dalam kedua-dua kategori. Berat dikira masuk kelas jika melebihi had minimum dan tidak melebihi had maksimum.</div>
      <div class="kp-ttd"><div>Disediakan oleh:<br><br>Nama: ${esc(S.u.nama)}<br>Tarikh:</div><div>Disemak oleh:<br><br>Nama:<br>Tarikh:</div></div>
    </div>`;
  el.style.display = 'block'; el.scrollTop = 0;
}

function borangCaw(id) {
  const c = (S.cawList || []).find(x => x.id === id) || {};
  modal(`<h3 style="color:var(--emas);margin-top:0">${id ? 'Kemas Kini' : 'Tambah'} Cawangan</h3>
    <label>Nama cawangan</label><input id="cNama" value="${esc(c.nama || '')}" placeholder="cth. SK Taman Panglima">
    <label>Alamat / lokasi (pilihan)</label><input id="cAlamat" value="${esc(c.alamat || '')}">
    <button class="utama penuh" style="margin-top:14px" onclick="simpanCaw('${esc(id || '')}')">Simpan</button>
    ${id ? `<button class="bahaya penuh" style="margin-top:8px" onclick="padamCaw('${esc(id)}')">Padam cawangan</button>` : ''}
    <button class="penuh" style="margin-top:8px" onclick="modal('')">Batal</button>`);
}
async function simpanCaw(id) { const r = await api('caw_simpan', { id, nama: $('#cNama').value, alamat: $('#cAlamat').value }); toast(r.msg); if (r.ok) { modal(''); tabGelang(); } }
async function padamCaw(id) { if (!confirm('Padam cawangan ini? Pesilatnya akan jadi tanpa cawangan.')) return; const r = await api('caw_padam', { id }); toast(r.msg); if (r.ok) { modal(''); if (S.cawPilih === id) S.cawPilih = ''; tabGelang(); } }
function tagCaw(id) {
  const c = S.cawList.find(x => x.id === id), aktif = S.ahli.filter(a => a.status_gel === 'AKTIF');
  S.tagSet = new Set(aktif.filter(a => a.cawangan === id).map(a => a.no_kp)); S.tagId = id;
  const lukis = () => { $('#tagSen').innerHTML = aktif.map(a => { const lain = a.cawangan && a.cawangan !== id ? namaCaw(a.cawangan) : '';
    return `<div class="item ${S.tagSet.has(a.no_kp) ? 'on' : ''}" onclick="S.tagSet.has('${esc(a.no_kp)}')?S.tagSet.delete('${esc(a.no_kp)}'):S.tagSet.add('${esc(a.no_kp)}');tagCaw.lukis()"><div class="k"><b>${esc(a.nama)}</b><small>${lain ? 'Kini: ' + esc(lain) : esc(namaBengkung(a.bengkung) || a.no_ahli)}</small></div><div class="semak">✓</div></div>`; }).join('');
    $('#tagBil').textContent = S.tagSet.size + ' dipilih'; };
  tagCaw.lukis = lukis;
  modal(`<h3 style="color:var(--emas);margin:0">📍 ${esc(c.nama)}</h3><p class="pudar" style="font-size:13px">Tanda pesilat yang berlatih di cawangan ini. <b id="tagBil"></b></p>
    <div id="tagSen"></div><button class="utama penuh" style="position:sticky;bottom:0" onclick="simpanTag()">Simpan</button>`);
  lukis();
}
async function simpanTag() {
  const id = S.tagId, tag = {};
  S.ahli.filter(a => a.status_gel === 'AKTIF').forEach(a => { if (S.tagSet.has(a.no_kp)) { if (a.cawangan !== id) tag[a.no_kp] = id; } else if (a.cawangan === id) tag[a.no_kp] = ''; });
  const r = await api('caw_tag', { tag }); toast(r.msg); if (r.ok) { modal(''); tabGelang(); }
}
async function tagSatu(kp, id) { const r = await api('caw_tag', { tag: { [kp]: id } }); toast(r.msg); const a = S.ahli.find(x => x.no_kp === kp); if (r.ok && a) a.cawangan = id; }
function pilihLogo(inp) {
  const f = inp.files[0]; inp.value = ''; if (!f) return;
  if (!/^image\/(png|jpeg|webp)$/.test(f.type)) return toast('Jenis fail tidak disokong. Guna JPG, PNG atau WEBP.');
  if (f.size > 5 * 1024 * 1024) return toast(`Fail terlalu besar (${(f.size / 1048576).toFixed(1)} MB). Maksimum 5 MB.`);
  const img = new Image(), url = URL.createObjectURL(f);
  img.onload = async () => {
    let saiz = 256, data = '';
    for (let cuba = 0; cuba < 6; cuba++) {
      const cv = document.createElement('canvas'), k = Math.min(1, saiz / Math.max(img.width, img.height));
      cv.width = Math.round(img.width * k); cv.height = Math.round(img.height * k);
      cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
      data = cv.toDataURL('image/webp', 0.85);
      if (!data.startsWith('data:image/webp')) data = f.type === 'image/jpeg' ? cv.toDataURL('image/jpeg', 0.85) : cv.toDataURL('image/png');
      if (data.length <= 45000) break;
      saiz = Math.round(saiz * 0.8);
    }
    URL.revokeObjectURL(url);
    if (data.length > 45000) return toast('Gambar terlalu terperinci. Cuba gambar lain.');
    $('#pratonton').src = data;
    const r = await api('logo_simpan', { data }); toast(r.msg);
    if (r.ok) { S.u.logo = data; mula(); }
  };
  img.onerror = () => toast('Gambar tidak dapat dibaca.');
  img.src = url;
}

/* ---- Permohonan (borang pendaftaran online) ---- */
const linkBorang = caw => new URL('daftar.html', location.href).href.split('?')[0] + '?g=' + encodeURIComponent(S.u.kod_gelanggang) + (caw ? '&c=' + encodeURIComponent(caw) : '');
async function tabMohon() {
  const [r, c] = await Promise.all([api('mohon_senarai'), api('caw_get')]);
  if (!r.ok) return $('#isi').innerHTML = `<p>${esc(r.msg)}</p>`;
  S.mohon = r.permohonan; S.cawList = c.ok ? c.cawangan : []; S.mTapis = S.mTapis || 'MENUNGGU'; S.mCaw = S.mCaw || '';
  lukisMohon();
}
function lukisMohon() {
  const link = linkBorang(S.mCaw), teks = `Borang pendaftaran pesilat ${S.u.nama_gelanggang} (Sri Gayong Panglima Ulung). Sila isi di pautan ini:`;
  const kira = st => S.mohon.filter(x => x.status === st).length;
  const l = S.mohon.filter(x => x.status === S.mTapis);
  $('#isi').innerHTML = `<div class="kad"><h3>🔗 Kongsi Borang Pendaftaran</h3>
      ${S.cawList.length ? `<select style="margin-bottom:10px" onchange="S.mCaw=this.value;lukisMohon()"><option value="">Semua cawangan (pemohon pilih sendiri)</option>${S.cawList.map(x => `<option value="${esc(x.id)}" ${x.id === S.mCaw ? 'selected' : ''}>📍 ${esc(x.nama)}</option>`).join('')}</select>` : ''}

      <div class="grid" style="grid-template-columns:repeat(3,1fr);margin-top:10px">
        <a href="https://wa.me/?text=${encodeURIComponent(teks + '\n' + link)}" target="_blank" style="text-decoration:none"><button class="penuh" style="border-color:#2d5a43;color:var(--hijau)">WhatsApp</button></a>
        <a href="https://t.me/share/url?url=${encodeURIComponent(link)}&text=${encodeURIComponent(teks)}" target="_blank" style="text-decoration:none"><button class="penuh" style="border-color:#24506e;color:#5ab4e2">Telegram</button></a>
        <button onclick="navigator.clipboard.writeText(${esc(JSON.stringify(link))}).then(()=>toast('Pautan disalin'))">📋 Salin</button></div>
      <a href="${esc(link)}" target="_blank" style="display:block;text-align:center;font-size:13px;margin-top:10px">Pratonton borang ›</a></div>
    ${cip('mTapis', [['MENUNGGU', `Menunggu (${kira('MENUNGGU')})`], ['LULUS', `Diluluskan (${kira('LULUS')})`], ['DITOLAK', `Ditolak (${kira('DITOLAK')})`]], S.mTapis, 'lukisMohon')}
    ${l.map(x => `<div class="item" onclick="bukaMohon('${esc(x.id)}')"><div class="k"><b>${esc(x.nama)}</b>
      <small>${x.umur != null ? x.umur + ' thn · ' : ''}${x.jantina === 'P' ? 'P' : 'L'}${x.nama_cawangan ? ' · 📍 ' + esc(x.nama_cawangan) : ''} · ${esc(tarikhMY(x.tarikh))}</small></div>
      <div class="r">${x.status === 'MENUNGGU' ? (x.wujud ? tag('SUDAH AHLI', 'KUNING') : tag('BAHARU', 'BIRU')) : x.status === 'LULUS' ? tag(x.no_ahli || 'LULUS', 'HIJAU') : tag('DITOLAK', 'MERAH')}</div></div>`).join('') || '<p class="pudar">Tiada permohonan.</p>'}`;

function bukaMohon(id) {
  const x = S.mohon.find(m => m.id === id); if (!x) return;
  const brs = (k, v) => v ? `<div class="bar2"><span class="pudar">${k}</span><b style="font-weight:600">${esc(v)}</b></div>` : '';
  const telW = String(x.tel_waris || x.tel_pesilat || '').replace(/\D/g, '').replace(/^6?0/, '60');
  modal(`<h3 style="color:var(--emas);margin:0">${esc(x.nama)}</h3><p class="pudar" style="margin:4px 0 0;font-size:13px">Dimohon ${esc(x.tarikh)}</p>
    <div class="kotakHasil">${brs('No. KP', x.no_kp)}${brs('Umur', x.umur != null ? x.umur + ' tahun' : '')}${brs('Jantina', x.jantina === 'P' ? 'Perempuan' : 'Lelaki')}${brs('Tarikh lahir', tarikhMY(x.tarikh_lahir))}
      ${brs('Cawangan', x.nama_cawangan)}${brs('Sekolah / kerja', x.sekolah)}${brs('Alamat', x.alamat)}${brs('Tel. pesilat', x.tel_pesilat)}${brs('Kesihatan', x.kesihatan)}</div>
    <div class="kotakHasil">${brs('Waris', x.nama_waris)}${brs('Hubungan', x.hubungan_waris)}${brs('No. KP waris', x.no_kp_waris)}${brs('Tel. waris', x.tel_waris)}${brs('E-mel', x.emel_waris)}
      ${brs('Kebenaran waris', x.kebenaran ? (x.kebenaran === 'DEWASA' ? 'Tidak perlu (18+)' : '✅ ' + x.kebenaran.replace('YA ', '')) : '❌ Tiada')}${brs('Akuan adat & adab', x.adat ? '✅ ' + x.adat.replace('YA ', '') : '')}</div>
    ${x.wujud ? `<div class="pdpa">⚠️ No. KP ini sudah berdaftar sebagai <b>${esc(x.wujud.no_ahli)}</b> (gelanggang utama ${esc(x.wujud.utama)}). Pilih cara di bawah.</div>` : ''}
    ${x.sebab ? `<p class="pudar">Sebab ditolak: ${esc(x.sebab)}</p>` : ''}
    ${x.status === 'MENUNGGU' ? `
      ${S.cawList.length ? `<label>Cawangan</label><select id="mlCaw"><option value="">— Tiada —</option>${S.cawList.map(c => `<option value="${esc(c.id)}" ${c.id === x.cawangan ? 'selected' : ''}>${esc(c.nama)}</option>`).join('')}</select>` : ''}

      : `<button class="utama penuh" style="margin-top:14px" onclick="lulusMohon('${esc(x.id)}','')">✅ Luluskan & Daftar Ahli</button>`}
      <button class="bahaya penuh" style="margin-top:8px" onclick="tolakMohon('${esc(x.id)}')">Tolak</button>` : ''}
    ${telW.length > 9 ? `<a href="https://wa.me/${telW}" target="_blank" style="text-decoration:none"><button class="penuh" style="margin-top:8px;border-color:#2d5a43;color:var(--hijau)">💬 WhatsApp waris</button></a>` : ''}
    <button class="penuh" style="margin-top:8px" onclick="modal('')">Tutup</button>`);
}
async function lulusMohon(id, mod) {
  const r = await api('mohon_lulus', { id, mod, bengkung: $('#mlBeng').value, cawangan: $('#mlCaw') ? $('#mlCaw').value : null });
  if (r.pendua) { toast(r.msg, 6000); return; }

}
async function tolakMohon(id) {
  const sebab = prompt('Sebab permohonan ditolak (pilihan):', ''); if (sebab === null) return;
  const r = await api('mohon_tolak', { id, sebab }); toast(r.msg); if (r.ok) { modal(''); tabMohon(); }
